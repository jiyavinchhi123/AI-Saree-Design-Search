services:
  - type: web
    name: ai-saree-design-search
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: ENV
        value: "production"
      - key: FRONTEND_URL
        value: "https://ai-saree-design-search.vercel.app"
      - key: MS_REDIRECT_URI
        value: "https://ai-saree-design-search.onrender.com/api/data-sources/onenote/auth/callback"
